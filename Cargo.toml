[workspace]
members = ["crates/contracts", "crates/servelet-runtime", "android/native"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"
rusqlite = { version = "=0.41.0", features = ["bundled"] }

# Debug APKs run servelets through wasmi and SQLite; unoptimized, a request takes seconds.
[profile.dev.package."*"]
opt-level = 3
