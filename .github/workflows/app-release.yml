# Builds, checks and signs the Genesis app. A tag v<versionName> publishes the release APK, the
# Android App Bundle, the developer APK, the native debug symbols and their checksums as a GitHub
# release with build provenance attestations. A manual run from any branch is a dry run: it signs
# with a key generated in the job and uploads the files as a workflow artifact only.
name: App release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The root repository records no Let commit: the lockfile's framework version names the Let
      # tag, and npm ci below fails if the two disagree.
      - name: Read the framework version
        id: framework
        run: |
          version="$(node -p 'require("./package-lock.json").packages["let/packages/core"].version')"
          echo "Let framework v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nirvanacp/let
          ref: v${{ steps.framework.outputs.version }}
          path: let
          persist-credentials: false
      - name: Read the app version
        id: version
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' android/app/build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "::error::Cannot read versionName from android/app/build.gradle.kts."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the tag against versionName
        if: ${{ github.event_name == 'push' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::The tag $GITHUB_REF_NAME names ${GITHUB_REF_NAME#v}, but android/app/build.gradle.kts has versionName $VERSION."
            exit 1
          fi
      # Node and npm match `engines` in package.json; tools/build.mjs refuses any other Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - run: npm install -g npm@11.14.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      # rust-toolchain.toml names the Rust version and the Android targets.
      - name: Install Rust and cargo-ndk
        run: |
          rustup toolchain install
          rustup show
          cargo install cargo-ndk --version 4.1.2 --locked
      # The versions android/app/build.gradle.kts names, in the SDK the runner image preinstalls.
      - name: Install the Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION"
      - run: npm ci --no-audit --no-fund
      # The platform checks, in the order of the platform verification table.
      - run: cargo build -p genesis-contracts
      - run: cargo build -p genesis-host
      - run: cargo clippy -p genesis-host -- -D warnings
      - run: cargo clippy -p genesis-servelet-runtime -- -D warnings
      - run: cargo test -p genesis-servelet-runtime
      - run: npm run typecheck
      - run: npm run check:packages
      # A tag run signs with the repository's release key; a dry run with a key made here.
      # Gradle reads the four GENESIS_* variables; secrets are masked and never echoed.
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GENESIS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GENESIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GENESIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GENESIS_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::Add the secrets GENESIS_KEYSTORE_BASE64, GENESIS_KEYSTORE_PASSWORD, GENESIS_KEY_ALIAS and GENESIS_KEY_PASSWORD."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=dry-run
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -keyalg RSA -keysize 4096 -validity 30 \
              -alias "$KEY_ALIAS" -dname "CN=Genesis dry run" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD"
          fi
          {
            echo "GENESIS_KEYSTORE_FILE=$keystore"
            echo "GENESIS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "GENESIS_KEY_ALIAS=$KEY_ALIAS"
            echo "GENESIS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: android/gradlew -p android :app:assembleRelease :app:bundleRelease :app:assembleDeveloper
      # Both APKs must verify, and every LOAD segment of the native library must be aligned to
      # 16 KB, which Google Play requires.
      - name: Check the outputs
        run: |
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          readelf="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for apk in android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/developer/app-developer.apk; do
            "$apksigner" verify --print-certs "$apk"
            libs="$RUNNER_TEMP/libs/$(basename "$apk" .apk)"
            unzip -q -o "$apk" 'lib/*/libgenesis_host.so' -d "$libs"
            for lib in "$libs"/lib/*/libgenesis_host.so; do
              misaligned="$("$readelf" -lW "$lib" | awk '$1 == "LOAD" && $NF != "0x4000"')"
              if [ -n "$misaligned" ]; then
                echo "::error::$apk: ${lib#"$libs"/} has LOAD segments not aligned to 16 KB: $misaligned"
                exit 1
              fi
            done
          done
      - name: Collect the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out symbols/arm64-v8a symbols/x86_64
          cp android/app/build/outputs/apk/release/app-release.apk "out/genesis-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/genesis-$VERSION.aab"
          cp android/app/build/outputs/apk/developer/app-developer.apk "out/genesis-$VERSION-developer.apk"
          # The unstripped libraries cargo ndk built; release and developer share this build.
          cp target/genesis/release/cargo/aarch64-linux-android/release/libgenesis_host.so symbols/arm64-v8a/
          cp target/genesis/release/cargo/x86_64-linux-android/release/libgenesis_host.so symbols/x86_64/
          (cd symbols && zip -q -r "../out/genesis-$VERSION-native-symbols.zip" arm64-v8a x86_64)
          (cd out && sha256sum genesis-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: genesis-${{ steps.version.outputs.version }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish ${{ github.ref_name }}
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: genesis-${{ needs.build.outputs.version }}
          path: out
      - name: Check the checksums
        working-directory: out
        run: sha256sum --check SHA256SUMS
      - name: Create a draft release
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$REPOSITORY" --draft --verify-tag --title "Genesis $VERSION" \
            --notes "Genesis $VERSION at $GITHUB_SHA. genesis-$VERSION.apk is the app; genesis-$VERSION-developer.apk is the debuggable build for applet builders (app.nirvana.genesis.dev)." \
            "${prerelease[@]}"
          gh release upload "$TAG" --repo "$REPOSITORY" out/*
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/genesis-${{ needs.build.outputs.version }}.apk
            out/genesis-${{ needs.build.outputs.version }}.aab
            out/genesis-${{ needs.build.outputs.version }}-developer.apk
      # Published last, so immutable releases lock the assets only once they are all attached.
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$REPOSITORY" --draft=false
