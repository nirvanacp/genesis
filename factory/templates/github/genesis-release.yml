# Copy to .github/workflows/genesis-release.yml in your applet repository.
# Replace both <genesis-sha> values with the same full Genesis commit sha, one that is on GitHub.
# A tag v<version> (single-applet repository) or <id>/v<version> (multi-applet repository)
# rebuilds the applet, compares it with the committed build and publishes a GitHub Release
# with the bundle, its release record and build provenance attestations.
name: Genesis release

on:
  push:
    tags: ['v*', '*/v*']

permissions:
  contents: read

jobs:
  release:
    uses: nirvanacp/genesis/.github/workflows/applet-release.yml@<genesis-sha>
    with:
      genesis-ref: <genesis-sha>
    permissions:
      contents: write
      id-token: write
      attestations: write
